<div class="form-container">
    <h2>Subir nuevo producto</h2>
    <form id="form-subir-producto" enctype="multipart/form-data">
        <div class="form-group">
            <label for="nombre_producto">Nombre del producto</label>
            <input type="text" id="nombre_producto" name="nombre_producto" required>
            <span class="error" id="error-nom-producto"></span>
        </div>

        <div class="form-group">
            <label for="sexo_producto">Sexo</label>
            <select id="sexo_producto" name="sexo_producto" required>
                <option value="" disabled selected>Selecciona el sexo del producto</option>
                <option value="masculino">Hombre</option>
                <option value="femenino">Mujer</option>
                <option value="unisex">Unisex</option>
            </select>
            <span class="error" id="error-sexo-producto"></span>
        </div>

        <div class="form-group">
            <label for="select_color">Color</label>
            <select id="select_color" name="select_color" required>
                <!-- colores dinamicos desde la db -->
            </select>
            <span class="error" id="error-color-producto"></span>
        </div>

        <div class="form-group">
            <label for="select_tallas">Talla</label>
            <select id="select_tallas" name="select_tallas" required>
                <!-- tallas dinamicas desde la db -->
            </select>
            <span class="error" id="error-talla-producto"></span>
        </div>

        <div class="form-group">
            <label for="entrega_producto">Entrega</label>
            <select id="entrega_producto" name="entrega_producto" required>
                <option value="" disabled selected>Selecciona tipo de entrega</option>
                <option value="domicilio">A domicilio</option>
                <option value="persona">En persona</option>
            </select>
            <span class="error" id="error-entrega-producto"></span>
        </div>

        <div class="form-group">
            <label for="descripcion_producto">Descripción</label>
            <textarea id="descripcion_producto" name="descripcion_producto" rows="3" required></textarea>
            <span class="error" id="error-desc-producto"></span>
        </div>

        <div class="form-group">
            <label for="condicion_producto">Condición</label>
            <select id="condicion_producto" name="condicion_producto" required>
                <option value="" disabled selected>Selecciona condición</option>
                <option value="nuevo">Nuevo</option>
                <option value="usado">Usado</option>
                <option value="bueno">Bueno</option>
                <option value="desgastado">Desgastado</option>
            </select>
            <span class="error" id="error-condicion-producto"></span>
        </div>

        <div class="form-group">
            <label for="stock_producto">Stock disponible</label>
            <input type="number" id="stock_producto" name="stock_producto" min="1" required>
            <span class="error" id="error-stock-producto"></span>
        </div>

        <div class="form-group">
            <label for="precio_producto">Precio (€)</label>
            <input type="number" id="precio_producto" name="precio_producto" min="0" step="0.10" required>
            <span class="error" id="error-precio-producto"></span>
        </div>

        <div class="form-group">
            <label for="imagenes_producto">Imágenes del producto</label>
            <input type="file" id="imagenes_producto" name="imagenes_producto[]" accept="image/*" multiple required>
            <div class="imagenes-subidas-producto">
            </div>
            <span class="error" id="error-imagenes-producto"></span>
        </div>

        <div class="form-group">
            <label for="select_equipo">Equipo</label>
            <select id="select_equipo" name="select_equipo" required>
            </select>
            <span class="error" id="error-equipo-producto"></span>
        </div>

        <div class="form-group">
            <label for="select_marca">Marca</label>
            <select id="select_marca" name="select_marca" required>
            </select>
            <span class="error" id="error-marca-producto"></span>
        </div>

        <div class="form-group">
            <label for="select_tipo">Tipo de producto</label>
            <select id="select_tipo" name="select_tipo" required>
            </select>
            <span class="error" id="error-tipo-producto"></span>
        </div>

        <div class="form-group">
            <label for="select_categoria">Categoría</label>
            <select id="select_categoria" name="select_categoria" required>
            </select>
            <span class="error" id="error-categoria-producto"></span>
        </div>

        <button type="submit" class="btn-formulario">Subir producto</button>
    </form>
</div>

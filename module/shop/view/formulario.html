<div class="form-container">
    <h2>Subir nuevo producto</h2>
    <form id="form-subir-producto" enctype="multipart/form-data">
        <div class="form-group">
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo" name="sexo" required>
                <option value="" disabled selected>Selecciona el sexo del producto</option>
                <option value="masculino">Hombre</option>
                <option value="femenino">Mujer</option>
                <option value="unisex">Unisex</option>
            </select>
        </div>

        <div class="form-group">
            <label for="select_color">Color</label>
            <select id="select_color" name="select_color" required>
                <!-- colores dinamicos desde la db -->
            </select>
        </div>

        <div class="form-group">
            <label for="select_tallas">Talla</label>
            <select id="select_tallas" name="select_tallas" required>
                <!-- tallas dinamicas desde la db -->
            </select>
        </div>

        <div class="form-group">
            <label for="entrega">Entrega</label>
            <select id="entrega" name="entrega" required>
                <option value="" disabled selected>Selecciona tipo de entrega</option>
                <option value="domicilio">A domicilio</option>
                <option value="persona">En persona</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="condicion">Condición</label>
            <select id="condicion" name="condicion" required>
                <option value="" disabled selected>Selecciona condición</option>
                <option value="nuevo">Nuevo</option>
                <option value="usado">Usado</option>
                <option value="bueno">Bueno</option>
                <option value="desgastado">Desgastado</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stock">Stock disponible</label>
            <input type="number" id="stock" name="stock" min="1" required>
        </div>

        <div class="form-group">
            <label for="precio">Precio (€)</label>
            <input type="number" id="precio" name="precio" min="0" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="imagenes">Imágenes del producto</label>
            <input type="file" id="imagenes" name="imagenes[]" accept="image/*" multiple required>
        </div>

        <div class="form-group">
            <label for="select_equipo">Equipo</label>
            <select id="select_equipo" name="select_equipo" required>
            </select>
        </div>

        <div class="form-group">
            <label for="select_marca">Marca</label>
            <select id="select_marca" name="select_marca" required>
            </select>
        </div>

        <div class="form-group">
            <label for="select_tipo">Tipo de producto</label>
            <select id="select_tipo" name="select_tipo" required>
            </select>
        </div>

        <div class="form-group">
            <label for="select_categoria">Categoría</label>
            <select id="select_categoria" name="select_categoria" required>
            </select>
        </div>

        <button type="submit" class="btn-formulario-submit">Subir producto</button>
    </form>
</div>
